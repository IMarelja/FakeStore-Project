services:
  postgres-medical:
    image: postgres:18
    container_name: fakestore-iis
    ports:
      - "5444:5432"
    environment:
      POSTGRES_DB: "fakestore"
      POSTGRES_PASSWORD: "password"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data_fakestore:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fakestore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data_fakestore:
